[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "s3r-vla"
authors = [
    {name = "Bo Liu"},
    {name = "Qiyan Zhao"},
    {name = "Liming Zhang"},
    {name = "Jingtao Yang"},
    {name = "Jun Huang"},
    {name = "Xu-Yao Zhang"},
    {name = "Yong Liu"},
]
description = "S3R-VLA: Self-Supervised Skill Learning for Robust Vision-Language-Action Models"
version = "1.0.0"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["vision-language-action models", "robotic manipulation", "skill learning", "robustness", "robot learning"]
# TODO: add a LICENSE file and set `license` (third-party notices: starVLA MIT, VLA-JEPA Apache-2.0, V-JEPA 2 MIT)
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
"Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
]

[project.optional-dependencies]
dev = [
    "black>=24.2.0",
    "gpustat",
    "ipython",
    "pre-commit",
    "ruff>=0.2.2",
]
sagemaker = [
    "boto3",
    "sagemaker"
]


[tool.setuptools.packages.find]
where = ["."]
exclude = [
    "tests",         # test directory
    "cache",         # cache directory
    "playground",
    "results",       # result directory
    "checkpoints",   # model checkpoint
    "scripts",       # script directory
    "eval",          # evaluation related directory
    ".vscode",       # VS Code configuration directory
    "*.egg-info",    # egg-info metadata directory
    "**.log",         # log file
    "*.tmp",         # temporary file
    "*.bak",         # backup file
    "**__pycache__**",   # Python cache directory
    "*.pyc",         # compiled Python file
    "*.pyo",          # optimized Python file
    "**bar**",
    "starVLA/config",

]

[tool.black]
line-length = 121
target-version = ["py310"]
preview = true

[tool.ruff]
line-length = 121
target-version = "py310"

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I", "RUF", "W"]
ignore = ["F722"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]
