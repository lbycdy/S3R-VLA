# S3R-VLA - LIBERO fine-tuning: settings shared by all versions (120k iterations, initialized from the VLA-JEPA
# pretrained checkpoint). A version config sets `_base_: s3r_vla_libero_base.yaml` and adds framework.name,
# framework.skill_model, and its batch size; see scripts/configs/s3r_vla_v{1,2,3}_libero_ft.yaml.
run_root_dir: checkpoints
seed: 42
trackers:
  - json
is_debug: false

framework:
  qwenvl:
    base_vlm: ./models/Qwen3-VL-2B-Instruct
    attn_implementation: sdpa  # sdpa or eager (needed by the full attention among skill tokens of v3)
    vl_hidden_dim: 2048
  action_model:                # action expert: DiT-B, 16 layers / 768 / 12 heads
    action_model_type: DiT-B
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 7
    state_dim: 8
    future_action_window_size: 6
    action_horizon: 7          # H
    past_action_window_size: 0
    noise_beta_alpha: 1.5      # flow time: 0.999 (1 - tau) ~ Beta(1.5, 1)
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4 # Euler steps at inference
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null
  vj2_model:
    base_encoder: ./models/vjepa2-vitl-fpc64-256   # frozen V-JEPA 2 ViT-L/16, tubelet size 2
    depth: 12                  # world-model predictor: 12 layers / 1024 / 8 heads
    num_heads: 8
    special_action_token: <|action_{}|>            # latent action tokens of VLA-JEPA (the skill tokens of v3)
    num_action_tokens_per_timestep: 8              # 8 tokens per time-step group, K-1 = 3 groups -> 24 tokens
    embodied_action_token: <|embodied_action|>
    num_embodied_action_tokens_per_instruction: 32
    num_frames: 8              # 2K frames per view
  reduce_in_full_precision: true

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: ./datasets/LeRobot/LIBERO
    data_mix: libero_all
    action_type: delta_qpos
    CoT_prompt: Your task is {instruction}. Infer the temporal dynamics from frames {actions} and produce the corresponding policy actions {e_actions}.
    resolution_size: 224
    load_all_data_for_training: true
    action_horizon: 7
    with_state: true

trainer:
  epochs: 100
  max_train_steps: 120000
  num_warmup_steps: 20000
  save_interval: 10000
  eval_interval: 100
  repeated_diffusion_steps: 4  # flow-matching pairs (tau, epsilon) per sample
  learning_rate:
    base: 3.0e-05              # skill modules
    qwen_vl_interface: 1.0e-05
    action_model: 0.0001
    vj_predictor: 0.0005
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-05            # final-to-peak ratio 0.33
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1   # not passed to DeepSpeed: the global batch is num_gpus x per_device_batch_size
  pretrained_checkpoint: ./models/VLA-JEPA-pretrain/VLA-JEPA-pretrain.pt
  reload_modules: "qwen_vl_interface,action_model,vj_encoder,vj_predictor"
  optimizer:
    name: AdamW
    betas:
      - 0.9
      - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-08
  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
